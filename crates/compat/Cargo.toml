[package]
name = "dronelab-compat"
description = "Line-by-line f64 port of gym-pybullet-drones, checked against recorded upstream outputs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dronelab.workspace = true
rayon = "1.12.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
