[workspace]
resolver = "3"
members = ["crates/core", "crates/sim", "crates/py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
dronelab-core = { path = "crates/core" }
dronelab = { path = "crates/sim" }
libm = "0.2.16"

[profile.release]
lto = "thin"
codegen-units = 1
